name: Build and Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 不传 GH_TOKEN，防止 electron-builder 自动创建 release
      # 需配合 electron-builder 配置 "publish": "never"
      - name: Run dist
        run: npm run build && npx electron-builder

      - name: Get next Beta number
        id: beta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有 release 标题，筛选 "0.6.22 Beta 数字" 格式，取最大序号
          LATEST_N=$(gh release list --limit 200 --json name \
            --jq '[.[].name | select(test("^0\\.6\\.22 Beta [0-9]+$")) | split(" ")[-1] | tonumber] | max // 0')
          echo "NEXT_N=$((LATEST_N + 1))" >> "$GITHUB_OUTPUT"

          # 生成 tag：当天第一个不带序号，后续带 -1, -2, ...
          BASE_DATE=$(date +'%Y%m%d')
          if ! gh release view "$BASE_DATE" &>/dev/null; then
            echo "TAG=$BASE_DATE" >> "$GITHUB_OUTPUT"
          else
            IDX=1
            while gh release view "${BASE_DATE}-${IDX}" &>/dev/null; do
              IDX=$((IDX + 1))
            done
            echo "TAG=${BASE_DATE}-${IDX}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.beta.outputs.TAG }}"
          TITLE="0.6.22 Beta ${{ steps.beta.outputs.NEXT_N }}"

          # 用 mapfile 数组收集产物，避免文件名含空格时出错
          mapfile -t FILES < <(find dist -maxdepth 1 -type f \( \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.zip" -o \
            -name "*.7z" -o \
            -name "*.dmg" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.snap" -o \
            -name "*.blockmap" \
          \))

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Error: No artifact files found in dist/"
            exit 1
          fi

          echo "Creating release: $TITLE (tag: $TAG)"
          printf "Uploading: %s\n" "${FILES[@]}"

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Build date: $(date +'%Y%m%d')" \
            --prerelease \
            "${FILES[@]}"