name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: '版本提升类型：小版本 0.7.1 -> 0.7.2；大版本 0.7.1 -> 0.8.0'
        required: true
        default: '小版本'
        type: choice
        options:
          - 小版本
          - 大版本

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve next version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASES_JSON=$(gh release list --limit 200 --json tagName,name,isPrerelease)
          export PACKAGE_VERSION RELEASES_JSON VERSION_BUMP

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const floorVersion = [0, 6, 22];
          const bump = process.env.VERSION_BUMP;
          const releases = JSON.parse(process.env.RELEASES_JSON || '[]');

          function parseVersion(value) {
            const match = String(value || '').trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
            return match ? match.slice(1).map(Number) : null;
          }

          function compareVersion(left, right) {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) {
                return left[index] - right[index];
              }
            }
            return 0;
          }

          function formatVersion(version) {
            return version.join('.');
          }

          const releaseVersions = releases
            .filter((release) => !release.isPrerelease)
            .flatMap((release) => [release.tagName, release.name])
            .map(parseVersion)
            .filter(Boolean);

          const packageVersion = parseVersion(process.env.PACKAGE_VERSION);
          const baseCandidates = [floorVersion, packageVersion, ...releaseVersions].filter(Boolean);
          const baseVersion = baseCandidates.reduce((latest, version) => (
            compareVersion(version, latest) > 0 ? version : latest
          ), floorVersion);

          let nextVersion;
          if (bump === '小版本') {
            nextVersion = [baseVersion[0], baseVersion[1], baseVersion[2] + 1];
          } else if (bump === '大版本') {
            nextVersion = [baseVersion[0], baseVersion[1] + 1, 0];
          } else {
            throw new Error(`Unsupported version bump: ${bump}`);
          }

          if (compareVersion(nextVersion, baseVersion) <= 0) {
            throw new Error(`Next version ${formatVersion(nextVersion)} must be greater than ${formatVersion(baseVersion)}`);
          }

          console.log(`CURRENT_VERSION=${formatVersion(baseVersion)}`);
          console.log(`NEXT_VERSION=${formatVersion(nextVersion)}`);
          console.log(`TAG=v${formatVersion(nextVersion)}`);
          NODE

      - name: Verify release version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.TAG }}"
          VERSION="${{ steps.version.outputs.NEXT_VERSION }}"

          echo "Base version: ${{ steps.version.outputs.CURRENT_VERSION }}"
          echo "Next version: $VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Error: Release $TAG already exists."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TAG already exists."
            exit 1
          fi

      - name: Apply package version
        run: npm version "${{ steps.version.outputs.NEXT_VERSION }}" --no-git-tag-version

      # 不传 GH_TOKEN，并显式禁止 electron-builder 自动创建 release
      - name: Build distributables
        run: npm run app:dist -- --publish never

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          TITLE="${{ steps.version.outputs.NEXT_VERSION }}"

          # 用 mapfile 数组收集产物，避免文件名含空格时出错
          mapfile -t FILES < <(find dist -maxdepth 1 -type f \( \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.zip" -o \
            -name "*.7z" -o \
            -name "*.dmg" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.snap" -o \
            -name "*.yml" -o \
            -name "*.blockmap" \
          \))

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Error: No artifact files found in dist/"
            exit 1
          fi

          if ! printf '%s\n' "${FILES[@]}" | grep -Ei '\.exe$' >/dev/null; then
            echo "Error: No Windows .exe installer found in dist/"
            exit 1
          fi

          echo "Creating release: $TITLE (tag: $TAG)"
          printf "Uploading: %s\n" "${FILES[@]}"

          NOTES=$(cat <<EOF
          Version: $TITLE
          Build date: $(date +'%Y%m%d')

          Download the Windows .exe installer from this release to update OpenGameSave.
          EOF
          )

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            "${FILES[@]}"
