name: Publish Database Editions

'on':
  push:
    paths:
      - database/database.db
      - database/licenses/XGPSAVETOOLS-LICENSE.txt
      - scripts/generate-db-patch.js
      - scripts/build-db-release.js
      - scripts/sync-xgp-save-tools.js
      - src/main/databaseManifest.js
      - src/main/xgpSourceFormat.js
      - .github/workflows/db-patch.yml
  schedule:
    - cron: '47 4 * * 3'
  workflow_dispatch:

concurrency:
  group: publish-database-editions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    environment: database-release
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_TAG: database

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install database tooling
        run: |
          npm ci --omit=dev --ignore-scripts
          npm rebuild better-sqlite3

      - name: Resolve the licensed upstream revision
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LICENSE=$(gh api repos/brodrigz/XgpSaveTools --jq '.license.spdx_id')
          if [ "$LICENSE" != "MIT" ]; then
            echo "Expected upstream SPDX license MIT, received: $LICENSE" >&2
            exit 1
          fi
          SHA=$(gh api repos/brodrigz/XgpSaveTools/commits/master --jq '.sha')
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid upstream commit SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Download registry and license from the same revision
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/upstream
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            --output dist/upstream/games.json \
            "https://raw.githubusercontent.com/brodrigz/XgpSaveTools/$UPSTREAM_SHA/XgpSaveTools/games.json"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            --output dist/upstream/LICENSE \
            "https://raw.githubusercontent.com/brodrigz/XgpSaveTools/$UPSTREAM_SHA/LICENSE"

      - name: Build the ephemeral Xbox-enhanced database
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          cp database/database.db dist/database-xbox-source.db
          node scripts/sync-xgp-save-tools.js \
            --apply \
            --registry-file dist/upstream/games.json \
            --license-file dist/upstream/LICENSE \
            --source-url "https://raw.githubusercontent.com/brodrigz/XgpSaveTools/$UPSTREAM_SHA/XgpSaveTools/games.json" \
            --license-url "https://github.com/brodrigz/XgpSaveTools/blob/$UPSTREAM_SHA/LICENSE" \
            --upstream-sha "$UPSTREAM_SHA" \
            --database dist/database-xbox-source.db \
            --report dist/xgp-save-tools-sync-report.json

      - name: Prepare and publish both database editions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/publications dist/previous
          RELEASE_EXISTS=false
          if gh release view "$DATABASE_TAG" >/dev/null 2>&1; then RELEASE_EXISTS=true; fi

          publish_immutable() {
            local file="$1" name existing
            name=$(basename "$file")
            existing=$(mktemp)
            if gh release download "$DATABASE_TAG" --pattern "$name" --output "$existing" 2>/dev/null; then
              cmp --silent "$file" "$existing" || { echo "Immutable asset conflict: $name" >&2; exit 1; }
            else
              gh release upload "$DATABASE_TAG" "$file"
            fi
            rm -f "$existing"
          }

          publish_variant() {
            local variant="$1" target="$2" source_sha="$3"
            local pointer suffix previous generated output exists=false legacy=false
            local manifest_path='' database_path='' previous_source=''
            suffix=''
            if [ "$variant" = 'xbox' ]; then suffix='_xbox'; fi
            pointer="current${suffix}.json"
            previous="dist/previous/$variant"
            generated="dist/generated-$variant"
            output="dist/publications/$variant"
            mkdir -p "$previous" "$generated" "$output"

            if [ "$RELEASE_EXISTS" = true ] && gh release download "$DATABASE_TAG" --pattern "$pointer" --dir "$previous" 2>/dev/null; then
              exists=true
              local manifest database
              manifest=$(node - "$previous/$pointer" "$variant" <<'NODE'
          const fs = require('fs');
          const { getDatabaseAssetNames, normalizeDatabaseVariant } = require('./src/main/databaseManifest');
          const pointer = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const variant = normalizeDatabaseVariant(process.argv[3]);
          if (normalizeDatabaseVariant(pointer.variant ?? 'standard') !== variant
              || !Number.isInteger(pointer.latest_version) || pointer.latest_version < 1
              || pointer.manifest !== getDatabaseAssetNames(variant, pointer.latest_version).manifest) process.exit(1);
          process.stdout.write(pointer.manifest);
          NODE
              )
              gh release download "$DATABASE_TAG" --pattern "$manifest" --dir "$previous"
              database=$(node - "$previous/$manifest" "$variant" <<'NODE'
          const fs = require('fs');
          const { validateDatabaseManifest } = require('./src/main/databaseManifest');
          const manifest = validateDatabaseManifest(JSON.parse(fs.readFileSync(process.argv[2], 'utf8')), process.argv[3]);
          process.stdout.write(manifest.database.name);
          NODE
              )
              gh release download "$DATABASE_TAG" --pattern "$database" --dir "$previous"
              node - "$previous/$manifest" "$variant" <<'NODE' > "$previous/patch-names.txt"
          const fs = require('fs');
          const { validateDatabaseManifest } = require('./src/main/databaseManifest');
          const manifest = validateDatabaseManifest(JSON.parse(fs.readFileSync(process.argv[2], 'utf8')), process.argv[3]);
          for (const patch of manifest.patches) console.log(patch.name);
          NODE
              while IFS= read -r patch; do
                [ -z "$patch" ] || gh release download "$DATABASE_TAG" --pattern "$patch" --dir "$previous"
              done < "$previous/patch-names.txt"
              manifest_path="$previous/$manifest"
              database_path="$previous/$database"
              previous_source=$(node -e "process.stdout.write(require('./$manifest_path').source_sha)")
              VARIANT="$variant" MANIFEST_PATH="$manifest_path" DATABASE_PATH="$database_path" node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const Database = require('better-sqlite3');
          const { validateDatabaseManifest } = require('./src/main/databaseManifest');
          const manifest = validateDatabaseManifest(JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, 'utf8')), process.env.VARIANT);
          const verify = descriptor => {
            const file = path.join(path.dirname(process.env.MANIFEST_PATH), descriptor.name);
            const bytes = fs.readFileSync(file);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (bytes.length !== descriptor.size || digest !== descriptor.sha256) throw new Error(`Invalid prior asset: ${descriptor.name}`);
          };
          verify(manifest.database);
          for (const patch of manifest.patches) verify(patch);
          const db = new Database(process.env.DATABASE_PATH, { readonly: true, fileMustExist: true });
          const storedVariant = db.prepare("SELECT value FROM metadata WHERE key='database_variant'").get()?.value || 'standard';
          if (db.pragma('quick_check', { simple: true }) !== 'ok'
              || db.pragma('user_version', { simple: true }) !== manifest.latest_version
              || storedVariant !== process.env.VARIANT) process.exit(1);
          db.close();
          NODE
            elif [ "$variant" = 'standard' ] && [ "$RELEASE_EXISTS" = true ] \
                && gh release download "$DATABASE_TAG" --pattern database.db --output "$previous/database.db" 2>/dev/null; then
              exists=true
              legacy=true
              database_path="$previous/database.db"
            fi

            if [ "$previous_source" = "$source_sha" ]; then
              printf -- '- %s: already published for source `%s`\n' "$variant" "$source_sha" >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            local from_args=()
            if [ "$exists" = true ]; then from_args=(--from "$database_path"); fi
            node scripts/generate-db-patch.js \
              "${from_args[@]}" --to "$target" --output "$generated" \
              --source-sha "$source_sha" --variant "$variant"

            if [ "$legacy" = true ]; then
              TARGET="$target" RESULT="$generated/generation-result.json" node <<'NODE'
          const fs = require('fs');
          const Database = require('better-sqlite3');
          const result = JSON.parse(fs.readFileSync(process.env.RESULT, 'utf8'));
          if (!result.changed) {
            const db = new Database(process.env.TARGET);
            db.pragma(`user_version = ${result.version}`);
            db.close();
            result.changed = true;
            result.requires_full_database = true;
            fs.writeFileSync(process.env.RESULT, JSON.stringify(result, null, 2));
          }
          NODE
            fi

            local changed version
            changed=$(node -e "process.stdout.write(String(require('./$generated/generation-result.json').changed))")
            version=$(node -e "process.stdout.write(String(require('./$generated/generation-result.json').version))")
            if [ "$changed" != true ]; then
              printf -- '- %s: no semantic changes\n' "$variant" >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            local previous_args=()
            if [ -n "$manifest_path" ]; then previous_args=(--previous-manifest "$manifest_path"); fi
            node scripts/build-db-release.js \
              --database "$target" --result "$generated/generation-result.json" \
              --output "$output" --source-sha "$source_sha" --variant "$variant" \
              "${previous_args[@]}"

            if [ "$RELEASE_EXISTS" = false ]; then
              gh release create "$DATABASE_TAG" --target "$GITHUB_SHA" \
                --title 'OpenGameSave Database' \
                --notes 'Machine-consumed immutable standard and Xbox-enhanced database updates.' \
                --latest=false
              RELEASE_EXISTS=true
            fi
            while IFS= read -r -d '' file; do publish_immutable "$file"; done \
              < <(find "$output" -maxdepth 1 -type f ! -name "$pointer" -print0)
            gh release upload "$DATABASE_TAG" "$output/$pointer" --clobber
            printf -- '- %s: published version %s\n' "$variant" "$version" >> "$GITHUB_STEP_SUMMARY"
          }

          STANDARD_SOURCE="$GITHUB_SHA"
          XBOX_SOURCE=$(sha256sum database/database.db dist/upstream/games.json dist/upstream/LICENSE \
            scripts/sync-xgp-save-tools.js src/main/xgpSourceFormat.js \
            | sha256sum | awk '{print $1}')
          printf '## Database publication\n\n- XgpSaveTools commit: `%s`\n' "$UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
          publish_variant standard database/database.db "$STANDARD_SOURCE"
          publish_variant xbox dist/database-xbox-source.db "$XBOX_SOURCE"
          if [ "$RELEASE_EXISTS" = true ]; then
            gh release edit "$DATABASE_TAG" --target "$GITHUB_SHA" --latest=false
          fi

      - name: Add Xbox merge summary
        shell: bash
        run: |
          node -e "const r=require('./dist/xgp-save-tools-sync-report.json'); const s=r.summary; process.stdout.write(['', '### Xbox enhanced edition','', '- Registry SHA-256: '+r.source.registry_sha256,'- Source entries: '+s.sourceEntries,'- Matched games: '+s.matchedGames,'- Mounted games: '+s.persistedMountedGames,'- Added WGS paths: '+s.addedWgsPaths,'- Added PGS paths: '+s.addedPgsPaths,'- Unmatched entries: '+s.unmatchedEntries,'- Ambiguous entries: '+s.ambiguousEntries,''].join('\n'))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generation reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-editions-${{ github.run_id }}
          path: |
            dist/publications
            dist/xgp-save-tools-sync-report.json
          if-no-files-found: error
          retention-days: 30
