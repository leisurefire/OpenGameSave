<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div id="menu" class="menu-container">
        <div id="menu-content-wrapper"></div>
    </div>
    <script>
        window.api.receive('set-menu-items', (items) => {
                        const menu = document.getElementById('menu');
            const wrapper = document.getElementById('menu-content-wrapper');
            wrapper.innerHTML = '';
            menu.style.animation = 'none';
            menu.offsetHeight; // force reflow
            menu.style.animation = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = `${item.icon ? `<i class="${item.icon}"></i>` : ''} <span>${item.label}</span>`;
                div.addEventListener('pointerdown', (event) => {
                    event.preventDefault();
                    window.api.send('menu-item-click', item.action, item.data);
                });
                wrapper.appendChild(div);
            });

                                    // Measure the wrapper and include the transparent body padding so
            // the BrowserWindow has enough room for anti-aliased rounded corners.
            requestAnimationFrame(() => {
                const style = window.getComputedStyle(document.body);
                const horizontalPadding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
                const verticalPadding = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
                const width = Math.ceil(menu.scrollWidth + horizontalPadding + 2);
                const height = Math.ceil(menu.offsetHeight + verticalPadding + 2);
                window.api.send('resize-and-show-menu', { width, height });
            });
        });
    </script>
</body>
</html>
