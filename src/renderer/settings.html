<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'">
    <title class="text-content" data-i18n="settings.title">Settings</title>
</head>

<body class="mica-effect settings-window-body" style="visibility:hidden">
    <div id="alert-container" class="fixed top-5 right-5 z-50 space-y-2"></div>

    <form class="settings-form space-y-5 scrollbar-thin scrollbar-thumb-white/20 scrollbar-track-transparent">
        <!-- Language selection -->
        <div>
            <label for="language" class="block mb-2 text-sm font-semibold opacity-80" data-i18n="settings.language">Language</label>
            <select id="language" class="w-full">
                <option value="en_US">English</option>
                <option value="zh_CN">中文</option>
            </select>
        </div>

        <!-- Max number of backups per game -->
        <div>
            <label for="max-backups" class="block mb-2 text-sm font-semibold opacity-80" data-i18n="settings.maxBackups">Maximum Backups Per Game</label>
            <input type="number" id="max-backups" class="w-full" min="1" max="1000">
        </div>

                <!-- Toggles -->
                <div class="space-y-3 pt-1">
                    <label class="flex items-center justify-between gap-3 cursor-pointer group">
                        <span class="text-sm opacity-80 group-hover:opacity-100" data-i18n="settings.auto_app_update">Check software update automatically</span>
                        <toggle-switch id="auto-app-update"></toggle-switch>
                    </label>
                    <label class="flex items-center justify-between gap-3 cursor-pointer group">
                        <span class="text-sm opacity-80 group-hover:opacity-100" data-i18n="settings.auto_db_update">Update database automatically</span>
                        <toggle-switch id="auto-db-update"></toggle-switch>
                    </label>
                    <label class="flex items-center justify-between gap-3 cursor-pointer group">
                        <span class="text-sm opacity-80 group-hover:opacity-100" data-i18n="settings.save_uninstalled_games">Save and display uninstalled games</span>
                        <toggle-switch id="save-uninstalled-games"></toggle-switch>
                    </label>
                    <label class="flex items-center justify-between gap-3 cursor-pointer group">
                        <span class="text-sm opacity-80 group-hover:opacity-100" data-i18n="settings.sync_accent_color">Sync theme color with system accent color</span>
                        <toggle-switch id="sync-accent-color"></toggle-switch>
                    </label>
                </div>

        <fieldset class="surface-effect p-5 border border-amber-400/25">
            <legend class="px-2 text-xs font-bold uppercase tracking-widest text-amber-300" data-i18n="settings.experimental_sources">Experimental Sources</legend>
            <div class="flex items-start justify-between gap-3">
                <div class="grow">
                    <div class="text-sm font-semibold" data-i18n="settings.xgp_source_label">Use XgpSaveTools registry</div>
                    <p class="mt-1 text-xs opacity-65" data-i18n="settings.xgp_source_hint">Off by default. Fetches third-party WGS/PGS path mappings at runtime; availability and accuracy are not guaranteed.</p>
                    <button type="button" id="xgp-source-project" class="mt-2 text-xs text-theme-accent hover:underline" data-i18n="settings.xgp_source_review">Review upstream project and terms</button>
                </div>
                <toggle-switch id="experimental-xgp-source"></toggle-switch>
            </div>
        </fieldset>

        <!-- Game Install Locations -->
        <fieldset class="surface-effect p-5 border border-white/10">
            <legend class="px-2 text-xs font-bold uppercase tracking-widest text-theme-accent" data-i18n="settings.installLocs">Install Locations</legend>
            
            <button type="button" id="auto-detect-paths" class="primary-button px-6 py-2 mb-4 text-xs w-full">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> <span data-i18n="settings.autoDetect">AUTO DETECT</span>
            </button>

            <div id="game-paths-container" class="space-y-2 max-h-80 overflow-y-auto pr-1 scrollbar-thin scrollbar-thumb-white/20 scrollbar-track-transparent"></div>

            <button type="button" id="add-new-path" class="w-full mt-4 py-2 border border-dashed border-white/20 rounded-lg hover:border-theme-accent hover:text-theme-accent transition-all text-sm">
                <i class="fa-solid fa-plus mr-2"></i> <span data-i18n="settings.addPath">Add Path</span>
            </button>
        </fieldset>
    </form>
</body>
</html>
