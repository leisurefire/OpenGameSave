<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'">
    <title class="text-content" data-i18n="settings.title">Settings</title>
</head>

<body class="mica-effect p-8 h-screen overflow-y-auto scrollbar-thin flex flex-col items-center">
    <div id="alert-container" class="fixed top-5 right-5 z-50 space-y-2"></div>

    <form class="max-w-md w-full mb-24 space-y-6">
        <!-- Language selection -->
        <div>
            <label for="language" class="block mb-2 text-sm font-semibold opacity-80" data-i18n="settings.language">Language</label>
            <select id="language" class="w-full">
                <option value="en_US">English (US)</option>
                <option value="zh_CN">简体中文</option>
                <option value="zh_TW">繁體中文</option>
            </select>
        </div>

        <!-- Backup save path selection -->
        <div>
            <label for="backup-path" class="block mb-2 text-sm font-semibold opacity-80" data-i18n="settings.backupPath">Backup Save Path</label>
            <div class="flex gap-2">
                <input type="text" id="backup-path" readonly class="flex-1">
                <button type="button" id="select-path" class="home-action-button px-4 py-2"><i class="fa-solid fa-ellipsis"></i></button>
            </div>
        </div>

        <!-- Max number of backups per game -->
        <div>
            <label for="max-backups" class="block mb-2 text-sm font-semibold opacity-80" data-i18n="settings.maxBackups">Maximum Backups Per Game</label>
            <input type="number" id="max-backups" class="w-full" min="1" max="1000">
        </div>

        <!-- Toggles -->
        <div class="space-y-4 pt-2">
            <label class="flex items-center gap-3 cursor-pointer group">
                <input id="auto-app-update" type="checkbox" class="accent-xbox-green w-5 h-5">
                <span class="text-sm opacity-80 group-hover:opacity-100" data-i18n="settings.auto_app_update">Check software update automatically</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer group">
                <input id="auto-db-update" type="checkbox" class="accent-xbox-green w-5 h-5">
                <span class="text-sm opacity-80 group-hover:opacity-100" data-i18n="settings.auto_db_update">Update database automatically</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer group">
                <input id="save-uninstalled-games" type="checkbox" class="accent-xbox-green w-5 h-5">
                <span class="text-sm opacity-80 group-hover:opacity-100" data-i18n="settings.save_uninstalled_games">Save and display uninstalled games</span>
            </label>
        </div>

        <!-- Game Install Locations -->
        <fieldset class="surface-effect p-5 border border-white/10">
            <legend class="px-2 text-xs font-bold uppercase tracking-widest text-xbox-green" data-i18n="settings.installLocs">Install Locations</legend>
            
            <button type="button" id="auto-detect-paths" class="primary-button px-6 py-2 mb-4 text-xs w-full">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> <span data-i18n="settings.autoDetect">AUTO DETECT</span>
            </button>

            <div id="game-paths-container" class="space-y-2"></div>

            <button type="button" id="add-new-path" class="w-full mt-4 py-2 border border-dashed border-white/20 rounded-lg hover:border-xbox-green hover:text-xbox-green transition-all text-sm">
                <i class="fa-solid fa-plus mr-2"></i> <span data-i18n="settings.addPath">Add Path</span>
            </button>
        </fieldset>
    </form>
</body>
</html>
