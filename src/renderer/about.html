<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://api.github.com;">
    <title class="text-content" data-i18n="about.title">About</title>
</head>

<body class="mica-effect about-container select-none">

    <div class="flex items-center gap-6 w-full max-w-md justify-center">
        <img src="../assets/logo.png" alt="App Logo" class="w-20 rounded-2xl shadow-2xl">
        <div class="text-left">
            <h1 class="text-2xl font-black text-xbox-green tracking-tight" data-i18n="main.title">Game Save Manager</h1>
            <div class="mt-1 space-y-0.5 opacity-60 text-xs">
                <p><span data-i18n="about.current_version">Current version:</span> <span id="current-version" class="font-mono"></span></p>
                <p><span data-i18n="about.latest_version">Latest version:</span> <span id="latest-version" class="font-mono" data-i18n="main.loading">Loading...</span></p>
            </div>
            <button id="update-button" class="hidden mt-3 primary-button px-4 py-1.5 text-[10px] font-bold" data-i18n="about.update">UPDATE NOW</button>
        </div>
    </div>

    <div class="surface-effect p-6 w-full max-w-sm space-y-3">
        <p class="text-sm flex justify-between">
            <span class="opacity-40" data-i18n="about.official_website">Website</span>
            <a id="website-link" class="text-xbox-green hover:underline cursor-pointer">gamezonelabs.com</a>
        </p>
        <p class="text-sm flex justify-between">
            <span class="opacity-40" data-i18n="about.github">GitHub</span>
            <a id="github-link" class="text-xbox-green hover:underline cursor-pointer">dyang886/Game-Save-Manager</a>
        </p>
        <p class="text-sm flex justify-between">
            <span class="opacity-40" data-i18n="about.bilibili">Bilibili</span>
            <a id="bilibili-link" class="text-xbox-green hover:underline cursor-pointer">@yongcan_yang</a>
        </p>
    </div>

    <footer class="mt-8 text-[10px] opacity-30 font-medium tracking-widest uppercase">
        Designed for Windows 11 & Xbox
    </footer>

</body>
</html>
