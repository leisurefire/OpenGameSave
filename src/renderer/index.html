<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'">
    <title class="text-content" data-i18n="main.title">Game Save Manager</title>
</head>

<body class="mica-effect p-6 pt-2 h-screen overflow-hidden">
    <!-- Top right alerts and progresses -->
    <div class="fixed top-4 right-5 z-60 space-y-2">
        <div id="progress-container"></div>
        <div id="alert-container"></div>
    </div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-40 animate-fadeIn"></div>

    <!-- Modals (Simplified and Styled) -->
    <div id="modal-info" tabindex="-1" aria-hidden="true"
        class="hidden animate-fadeInShift overflow-x-hidden fixed inset-0 z-50 flex justify-center items-center p-4">
        <div class="modal-container w-full max-w-2xl max-h-full flex flex-col">
            <div class="flex items-center justify-between p-5 border-b border-white/10">
                <h3 id="modal-info-title" class="text-xl font-bold text-xbox-green"></h3>
                <button type="button" id="modal-info-close" class="text-white/60 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="p-6 modal-body-scroll space-y-4">
                <p id="modal-info-content" class="text-white/80 leading-relaxed"></p>
            </div>
            <div class="p-5 border-t border-white/10 flex justify-end gap-3">
                <button type="button" id="modal-info-no" class="px-6 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-colors" style="display: none;">No</button>
                <button type="button" id="modal-info-confirm" class="primary-button px-8 py-2">Ok</button>
            </div>
        </div>
    </div>

    <!-- Other modals (Export, Import, Manage, AutoBackup) follow similar styling in JS or keep IDs -->
    <!-- I will keep the IDs consistent so JS doesn't break -->
    <div id="modal-export" class="hidden animate-fadeInShift fixed inset-0 z-50 flex justify-center items-center p-4">
        <div class="modal-container w-full max-w-2xl p-6">
            <h3 class="text-xl font-bold text-xbox-green mb-6" data-i18n="alert.export_backups">Export Backups</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2 opacity-60" data-i18n="alert.export_scope">Export scope</label>
                    <div class="space-y-2">
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="radio" name="export-scope" value="all" checked class="accent-xbox-green">
                            <span class="group-hover:text-xbox-green transition-colors" data-i18n="alert.export_all_games">All games</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="radio" name="export-scope" value="backup" class="accent-xbox-green">
                            <span class="group-hover:text-xbox-green transition-colors" data-i18n="alert.export_selected_backup">Selected games from backup</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 opacity-60" data-i18n="alert.export_count">Number of exports per game</label>
                    <input type="number" id="modal-export-count" value="1" min="1" class="w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 opacity-60" data-i18n="alert.export_path">Export path</label>
                    <div class="flex gap-2">
                        <input type="text" id="modal-export-path" readonly class="flex-1">
                        <button id="modal-export-select-path" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg">...</button>
                    </div>
                </div>
            </div>
            <div class="mt-8 flex justify-end gap-3">
                <button id="modal-export-close" class="px-6 py-2">Cancel</button>
                <button id="modal-export-confirm" class="primary-button px-8 py-2" data-i18n="main.export">Export</button>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div id="modal-import" class="hidden animate-fadeInShift fixed inset-0 z-50 flex justify-center items-center p-4">
        <div class="modal-container w-full max-w-2xl p-6">
            <h3 class="text-xl font-bold text-xbox-green mb-6" data-i18n="alert.import_backups">Import Backups</h3>
            <div class="space-y-4">
                <label class="block text-sm font-medium mb-2 opacity-60" data-i18n="alert.gsmr_path">GSM file path</label>
                <div class="flex gap-2">
                    <input type="text" id="modal-import-path" readonly class="flex-1">
                    <button id="modal-import-select-path" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg">...</button>
                </div>
            </div>
            <div class="mt-8 flex justify-end gap-3">
                <button id="modal-import-close" class="px-6 py-2">Cancel</button>
                <button id="modal-import-confirm" class="primary-button px-8 py-2" data-i18n="main.import">Import</button>
            </div>
        </div>
    </div>

    <!-- Manage Backups Modal -->
    <div id="modal-manage-backups" class="hidden animate-fadeInShift fixed inset-0 z-50 flex justify-center items-center p-4">
        <div class="modal-container w-full max-w-4xl max-h-[85vh] flex flex-col p-6">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h3 id="modal-manage-backups-title" class="text-2xl font-bold text-xbox-green"></h3>
                    <div id="modal-manage-backups-header-info" class="text-sm opacity-60 mt-1"></div>
                </div>
                <button id="modal-manage-backups-close" class="p-2 opacity-60 hover:opacity-100"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
            </div>
            <div id="modal-manage-backups-content" class="flex-1 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Auto Backup Modal -->
    <div id="modal-auto-backup" class="hidden animate-fadeInShift fixed inset-0 z-50 flex justify-center items-center p-4">
        <div class="modal-container w-full max-w-lg p-6">
            <h3 id="modal-auto-backup-title" class="text-xl font-bold text-xbox-green mb-6 flex items-center gap-2"></h3>
            <div id="modal-auto-backup-content" class="space-y-4"></div>
            <div class="mt-8 flex justify-end gap-3">
                <button id="modal-auto-backup-close" class="px-6 py-2">Cancel</button>
                <button id="modal-auto-backup-confirm" class="primary-button px-8 py-2">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="flex items-center justify-between mb-6 border-b border-white/10 pb-2">
        <nav class="flex gap-1" id="main-tab" role="tablist">
            <button id="backup-tab" data-tabs-target="#backup" role="tab" class="px-6 py-3 font-semibold transition-all hover:text-xbox-green opacity-60 active:opacity-100" data-i18n="main.backup">Backup</button>
            <button id="restore-tab" data-tabs-target="#restore" role="tab" class="px-6 py-3 font-semibold transition-all hover:text-xbox-green opacity-60 active:opacity-100" data-i18n="main.restore">Restore</button>
        </nav>

        <div class="flex items-center gap-3">
            <div class="relative">
                <button id="home-options-button" class="home-action-button px-4 py-2 flex items-center gap-2 text-sm font-semibold">
                    <i class="fa-solid fa-gear"></i> <span data-i18n="main.options">Options</span> <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </button>
                <div id="home-options-menu" class="hidden absolute right-0 top-full mt-2 w-52 floating-surface overflow-hidden z-30">
                    <a href="#" data-home-action="settings" class="block px-4 py-3 hover:bg-xbox-green hover:text-black transition-colors" data-i18n="settings.title">Settings</a>
                    <a href="#" data-home-action="view-account-ids" class="block px-4 py-3 hover:bg-xbox-green hover:text-black transition-colors" data-i18n="main.view_account_ids">View Account IDs</a>
                    <a href="#" data-home-action="scan-full" class="block px-4 py-3 hover:bg-xbox-green hover:text-black transition-colors" data-i18n="main.scan_full">Scan Full Database</a>
                    <a href="#" data-home-action="about" class="block px-4 py-3 hover:bg-xbox-green hover:text-black transition-colors" data-i18n="about.title">About</a>
                </div>
            </div>
            <button id="home-import-button" class="home-action-button px-4 py-2 text-sm font-semibold flex items-center gap-2">
                <i class="fa-solid fa-file-import"></i>
                <span data-i18n="main.import">Import</span>
            </button>
            <button id="home-export-button" class="home-action-button px-4 py-2 text-sm font-semibold flex items-center gap-2">
                <i class="fa-solid fa-file-export"></i>
                <span data-i18n="main.export">Export</span>
            </button>
            <button id="update-database" class="home-action-button px-4 py-2 text-sm font-semibold flex items-center gap-2 text-xbox-green">
                <i id="update-database-icon" class="fa-solid fa-rotate"></i>
                <span id="update-database-text" data-i18n="main.update_database">Update Database</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-tab-content">
        <!-- Tab 1: Backup -->
        <section id="backup" role="tabpanel" class="hidden">
            <div id="backup-loading" class="flex justify-center p-20 opacity-40" data-i18n="main.loading">Loading...</div>
            
            <div id="backup-summary" class="hidden text-center py-10 animate-fadeInShift">
                <h2 class="text-4xl font-black mb-6" data-i18n="main.backup_complete">BACKUP COMPLETE</h2>
                <i class="fa-solid fa-circle-check text-xbox-green text-7xl mb-8"></i>
                <div class="space-y-2 text-lg opacity-80">
                    <p id="backup-summary-total-games"></p>
                    <p id="backup-summary-total-size"></p>
                    <p id="backup-summary-save-path" class="text-sm opacity-50"></p>
                </div>
                <button id="backup-summary-done" class="primary-button px-10 py-3 mt-10">DONE</button>
            </div>

            <div id="backup-content" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 opacity-40"></i>
                        <input type="text" id="backup-search" class="pl-10 w-80" data-i18n-placeholder="main.search_for_games">
                    </div>
                    <div class="text-right">
                        <div id="backup-selected-count" class="text-xl font-bold"></div>
                        <div id="backup-selected-size" class="text-sm opacity-50"></div>
                    </div>
                </div>

                <div class="table-container h-[calc(100vh-250px)]">
                    <table class="w-full text-left">
                        <thead>
                            <tr>
                                <th class="w-12 p-4"><input id="backup-checkbox-all-search" type="checkbox" class="accent-xbox-green"></th>
                                <th class="p-4" data-i18n="main.game_name">Game Name</th>
                                <th class="p-4" data-i18n="main.supported_plats">Platforms</th>
                                <th class="p-4" data-i18n="main.backup_size">Size</th>
                                <th class="p-4" data-i18n="main.newest_backup_time">Last Backup</th>
                                <th class="p-4 text-center" data-i18n="main.more">Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="flex justify-end">
                    <button id="backup-button" class="primary-button px-8 py-3 flex items-center gap-2">
                        <i id="backup-icon" class="fa-solid fa-bolt"></i> <span id="backup-text" data-i18n="main.backup_selected">Backup Selected</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Tab 2: Restore -->
        <section id="restore" role="tabpanel" class="hidden">
            <div id="restore-loading" class="flex justify-center p-20 opacity-40" data-i18n="main.loading">Loading...</div>
            
            <div id="restore-summary" class="hidden text-center py-10 animate-fadeInShift">
                <h2 class="text-4xl font-black mb-6" data-i18n="main.restore_complete">RESTORE COMPLETE</h2>
                <i class="fa-solid fa-circle-check text-xbox-green text-7xl mb-8"></i>
                <div class="space-y-2 text-lg opacity-80">
                    <p id="restore-summary-total-games"></p>
                    <p id="restore-summary-total-size"></p>
                </div>
                <button id="restore-summary-done" class="primary-button px-10 py-3 mt-10">DONE</button>
            </div>

            <div id="restore-content" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <input type="text" id="restore-search" class="w-80" data-i18n-placeholder="main.search_for_games">
                    <div class="text-right">
                        <div id="restore-selected-count" class="text-xl font-bold"></div>
                        <div id="restore-selected-size" class="text-sm opacity-50"></div>
                    </div>
                </div>

                <div class="table-container h-[calc(100vh-250px)]">
                    <table class="w-full text-left">
                        <thead>
                            <tr>
                                <th class="w-12 p-4"><input id="restore-checkbox-all-search" type="checkbox" class="accent-xbox-green"></th>
                                <th class="p-4" data-i18n="main.game_name">Game Name</th>
                                <th class="p-4" data-i18n="main.backup_count">Backups</th>
                                <th class="p-4" data-i18n="main.restore_size">Size</th>
                                <th class="p-4" data-i18n="main.newest_backup_time">Last Backup</th>
                                <th class="p-4 text-center" data-i18n="main.more">Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="flex justify-end">
                    <button id="restore-button" class="primary-button px-8 py-3 flex items-center gap-2">
                        <i id="restore-icon" class="fa-solid fa-clock-rotate-left"></i> <span id="restore-text" data-i18n="main.restore_selected">Restore Selected</span>
                    </button>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
