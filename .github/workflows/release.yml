name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: '发布通道'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - prerelease
      version_bump:
        description: '版本提升：patch 0.7.1 -> 0.7.2；minor 0.7.1 -> 0.8.0'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
      prerelease_label:
        description: '预发布标识（仅 prerelease 通道生效）'
        required: true
        default: beta
        type: choice
        options:
          - beta
          - rc

concurrency:
  group: application-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout the exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require an up-to-date main dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Application releases can only be dispatched from main."
            exit 1
          fi
          git fetch origin main --tags
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced after this workflow was dispatched; start a new release run."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native test dependency
        run: npm rebuild better-sqlite3

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Resolve next version and channel
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_BUMP: ${{ inputs.version_bump }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          PRERELEASE_LABEL: ${{ inputs.prerelease_label }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASES_JSON=$(gh release list --limit 200 --json tagName,isPrerelease)
          export PACKAGE_VERSION RELEASES_JSON VERSION_BUMP RELEASE_CHANNEL PRERELEASE_LABEL
          node scripts/resolve-release-version.js >> "$GITHUB_OUTPUT"

      - name: Verify release identity is unused
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.TAG }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi

      - name: Apply package version
        run: npm version "${{ steps.version.outputs.NEXT_VERSION }}" --no-git-tag-version

      - name: Run checks
        run: npm run check

      - name: Build distributables
        env:
          UPDATE_CHANNEL: ${{ steps.version.outputs.UPDATE_CHANNEL }}
        run: npm run app:dist:release

      - name: Validate package and updater metadata
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.NEXT_VERSION }}'
          node scripts/validate-app-release.js `
            --dist dist `
            --version $version `
            --report dist/release-artifacts.json

      - name: Create and atomically push release commit and annotated tag
        id: release_commit
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.TAG }}"
          VERSION="${{ steps.version.outputs.NEXT_VERSION }}"
          UNEXPECTED=$(git status --porcelain --untracked-files=no | grep -Ev '^ M package(-lock)?\.json$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "Build unexpectedly changed tracked files:"
            printf '%s\n' "$UNEXPECTED"
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "chore(release): $TAG"
          RELEASE_COMMIT=$(git rev-parse HEAD)
          git tag -a "$TAG" -m "OpenGameSave $VERSION" "$RELEASE_COMMIT"
          TAG_VERSION=$(git show "$TAG:package.json" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(JSON.parse(s).version))")
          test "$TAG_VERSION" = "$VERSION"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "main advanced during the build; refusing to publish stale artifacts."
            exit 1
          }
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$TAG"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Create draft release with verified tag
        id: draft_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.TAG }}"
          VERSION="${{ steps.version.outputs.NEXT_VERSION }}"
          CHANNEL="${{ steps.version.outputs.UPDATE_CHANNEL }}"
          INSTALLER="dist/OpenGameSave-Setup-$VERSION.exe"
          FILES=("$INSTALLER" "$INSTALLER.blockmap" "dist/$CHANNEL.yml")
          FLAGS=(--draft --verify-tag --target "${{ steps.release_commit.outputs.RELEASE_COMMIT }}")
          if [ "${{ steps.version.outputs.IS_PRERELEASE }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          NOTES=$(printf 'Version: %s\nChannel: %s\nBuild source: %s\n' "$VERSION" "${{ inputs.release_channel }}" "${{ steps.release_commit.outputs.RELEASE_COMMIT }}")
          gh release create "$TAG" "${FLAGS[@]}" --title "$VERSION" --notes "$NOTES" "${FILES[@]}"
          RELEASE_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .tag_name == \"$TAG\") | .id" | head -n 1)
          test -n "$RELEASE_ID" || {
            echo "Draft release $TAG was created but could not be resolved by ID."
            exit 1
          }
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Verify remote assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.TAG }}"
          VERSION="${{ steps.version.outputs.NEXT_VERSION }}"
          RELEASE_ID="${{ steps.draft_release.outputs.RELEASE_ID }}"
          VERIFIED=false
          for attempt in 1 2 3 4 5 6; do
            if gh api -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > dist/remote-release.json \
              && node scripts/validate-app-release.js \
                --dist dist \
                --version "$VERSION" \
                --remote-json dist/remote-release.json; then
              VERIFIED=true
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "Draft release assets did not become verifiable in time."
              exit 1
            fi
            sleep 10
          done
          test "$VERIFIED" = true
          REMOTE_TAG_COMMIT=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          test "$REMOTE_TAG_COMMIT" = "${{ steps.release_commit.outputs.RELEASE_COMMIT }}" || {
            echo "Remote annotated tag does not resolve to the built release commit."
            exit 1
          }

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.TAG }}"
          RELEASE_ID="${{ steps.draft_release.outputs.RELEASE_ID }}"
          if [ "${{ steps.version.outputs.IS_PRERELEASE }}" = "true" ]; then
            PRERELEASE=true
            MAKE_LATEST=false
          else
            PRERELEASE=false
            MAKE_LATEST=true
          fi
          PUBLISHED=false
          for attempt in 1 2 3 4 5 6; do
            if gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false \
              -F prerelease="$PRERELEASE" \
              -f make_latest="$MAKE_LATEST" >/dev/null; then
              PUBLISHED=true
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "Draft release could not be published."
              exit 1
            fi
            sleep 10
          done
          test "$PUBLISHED" = true
          VISIBLE=false
          for attempt in 1 2 3 4 5 6; do
            if gh api -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq "select(.draft == false and .prerelease == $PRERELEASE) | .tag_name" \
              | grep -Fx "$TAG"; then
              VISIBLE=true
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "Published release did not become publicly visible in time."
              exit 1
            fi
            sleep 10
          done
          test "$VISIBLE" = true

      - name: Add release summary
        shell: bash
        run: |
          printf '## Application release\n\n- Tag: `%s`\n- Version: `%s`\n- Channel: `%s`\n- Commit: `%s`\n- Remote assets verified: yes\n' \
            '${{ steps.version.outputs.TAG }}' \
            '${{ steps.version.outputs.NEXT_VERSION }}' \
            '${{ inputs.release_channel }}' \
            '${{ steps.release_commit.outputs.RELEASE_COMMIT }}' \
            >> "$GITHUB_STEP_SUMMARY"
