name: Publish Database Update

'on':
  push:
    paths:
      - database/database.db
      - scripts/generate-db-patch.js
      - .github/workflows/db-patch.yml
  workflow_dispatch:

concurrency:
  group: publish-database-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_TAG: database

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install database tooling
        run: |
          npm ci --omit=dev --ignore-scripts
          npm rebuild better-sqlite3

      - name: Download the currently published database
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$DATABASE_TAG" >/dev/null 2>&1; then
            gh release download "$DATABASE_TAG" \
              --pattern database.db \
              --output old_database.db \
              --clobber
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the next sequential patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/database-update
          if [ "${{ steps.previous.outputs.exists }}" = "true" ]; then
            node scripts/generate-db-patch.js \
              --from old_database.db \
              --to database/database.db \
              --output dist/database-update
          else
            node scripts/generate-db-patch.js \
              --from "" \
              --to database/database.db \
              --output dist/database-update
          fi

      - name: Validate database update artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          PATCH_FILE=$(find dist/database-update -maxdepth 1 -type f -name 'db_patch_v*.json' -print -quit)
          if [ -z "$PATCH_FILE" ]; then
            echo "No database patch was generated."
            exit 1
          fi
          PATCH_NAME=$(basename "$PATCH_FILE")
          VERSION=$(node -e "const Database=require('better-sqlite3');const db=new Database('database/database.db',{readonly:true});const check=db.pragma('quick_check',{simple:true});const version=db.pragma('user_version',{simple:true});db.close();if(check!=='ok'||!Number.isInteger(version)||version<1)process.exit(1);process.stdout.write(String(version));")
          PATCH_VERSION=$(node -e "const patch=require('./$PATCH_FILE');if(patch.version!==Number(process.argv[1]))process.exit(1);process.stdout.write(String(patch.version));" "$VERSION")
          echo "patch_file=$PATCH_FILE" >> "$GITHUB_OUTPUT"
          echo "patch_name=$PATCH_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PATCH_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create the database release when missing
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$DATABASE_TAG" >/dev/null 2>&1; then
            gh release create "$DATABASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "OpenGameSave Database" \
              --notes "Machine-consumed database updates for OpenGameSave. This release is maintained by GitHub Actions." \
              --latest=false
          fi

      - name: Publish patch and full database
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$DATABASE_TAG" \
            "${{ steps.artifacts.outputs.patch_file }}" \
            database/database.db \
            --clobber

      - name: Add the publication summary
        shell: bash
        run: |
          {
            echo "## Database update published"
            echo
            echo "- Release tag: \`$DATABASE_TAG\`"
            echo "- Database version: ${{ steps.artifacts.outputs.version }}"
            echo "- Patch: \`${{ steps.artifacts.outputs.patch_name }}\`"
            echo "- Full fallback: \`database.db\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database-update-v${{ steps.artifacts.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.patch_file }}
            database/database.db
          if-no-files-found: error
          retention-days: 30
