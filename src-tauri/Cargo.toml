[package]
name = "opengamesave"
version = "0.7.3"
description = "Backup, restore and synchronize PC game saves"
edition = "2021"
rust-version = "1.93"
license = "GPL-3.0-only"

[lib]
name = "opengamesave_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
glob = "0.3"
regex = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.22", default-features = false, features = ["compress", "util"] }
tempfile = "3"
filetime = "0.2"
fs2 = "0.4"
wait-timeout = "0.2"
unicode-normalization = "0.1"
dirs = "6"
semver = "1"
notify = "8"
sys-locale = "0.3"
digest_auth = "0.3.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
