name: Build and Release
on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, prerelease]
      version_bump:
        description: Version increment
        required: true
        default: minor
        type: choice
        options: [patch, minor]
      prerelease_label:
        description: Prerelease label
        required: true
        default: beta
        type: choice
        options: [beta, rc]
concurrency:
  group: application-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    environment: application-release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OGS_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the current main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: rustup show
      - run: npm ci
      - name: Resolve version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_BUMP: ${{ inputs.version_bump }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          PRERELEASE_LABEL: ${{ inputs.prerelease_label }}
        run: |
          set -euo pipefail
          export PACKAGE_VERSION=$(node -p "require('./package.json').version")
          export RELEASES_JSON=$(gh release list --limit 200 --json tagName,isPrerelease)
          node scripts/resolve-release-version.js >> "$GITHUB_OUTPUT"
      - name: Verify unused release identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.version.outputs.TAG }}'
          if gh release view "$TAG" >/dev/null 2>&1; then exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
      - name: Apply version
        run: |
          npm version '${{ steps.version.outputs.NEXT_VERSION }}' --no-git-tag-version
          node scripts/prepare-tauri-release.cjs
      - name: Import Windows signing certificate
        shell: pwsh
        env:
          OGS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          OGS_CSC_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          OGS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:OGS_CSC_LINK -or !$env:OGS_PUBLISHER -or !$env:OGS_UPDATER_PUBLIC_KEY) { throw 'Windows signing identity and the Tauri updater public key are required.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'ogs-release.pfx'
          if ($env:OGS_CSC_LINK.StartsWith('https://')) {
            Invoke-WebRequest -Uri $env:OGS_CSC_LINK -OutFile $certificatePath
          } else {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:OGS_CSC_LINK))
          }
          try {
            $password = if ($env:OGS_CSC_PASSWORD) { ConvertTo-SecureString $env:OGS_CSC_PASSWORD -AsPlainText -Force } else { [Security.SecureString]::new() }
            $imported = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $signingCertificates = @($imported | Where-Object { $_.HasPrivateKey })
            if ($signingCertificates.Count -ne 1) { throw 'Expected exactly one certificate with a private key.' }
            $certificate = $signingCertificates[0]
            "OGS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
            if ($certificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne $env:OGS_PUBLISHER -and $certificate.Subject -ne $env:OGS_PUBLISHER) { throw 'Unexpected signing certificate publisher.' }
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force
          }
      - name: Validate source
        run: npm run check
      - name: Build signed Tauri installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run app:dist:release
      - name: Commit and tag the exact built version
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.version.outputs.TAG }}'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          UNEXPECTED=$(git status --porcelain --untracked-files=no | grep -Ev '^ M (package(-lock)?\.json|src-tauri/Cargo\.(toml|lock))$' || true)
          test -z "$UNEXPECTED"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "OpenGameSave $TAG"
          gh auth setup-git
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FLAGS=(--draft --verify-tag --target '${{ steps.commit.outputs.sha }}')
          if [ '${{ inputs.release_channel }}' = prerelease ]; then FLAGS+=(--prerelease); fi
          gh release create '${{ steps.version.outputs.TAG }}' "${FLAGS[@]}" --title '${{ steps.version.outputs.NEXT_VERSION }}' --generate-notes dist/release/*
      - name: Verify remote bytes before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'ogs-remote-release'
          gh release download '${{ steps.version.outputs.TAG }}' --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Remote artifact download failed.' }
          $downloadedChecksums = Join-Path $destination 'checksums.json'
          if ((Get-FileHash -LiteralPath $downloadedChecksums -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath dist/release/checksums.json -Algorithm SHA256).Hash) { throw 'Remote checksum manifest differs from the validated local manifest.' }
          $checksums = Get-Content -LiteralPath dist/release/checksums.json | ConvertFrom-Json
          foreach ($artifact in $checksums) {
            $file = Join-Path $destination $artifact.name
            if ((Get-Item -LiteralPath $file).Length -ne $artifact.size -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $artifact.sha256) { throw 'Remote release bytes differ from validated local artifacts.' }
          }
      - name: Publish verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST=true
          if [ '${{ inputs.release_channel }}' = prerelease ]; then LATEST=false; fi
          gh release edit '${{ steps.version.outputs.TAG }}' --draft=false --latest="$LATEST"
      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:OGS_CERTIFICATE_THUMBPRINT -match '^[A-Fa-f0-9]{40}$') {
            $certificatePath = "Cert:\CurrentUser\My\$env:OGS_CERTIFICATE_THUMBPRINT"
            if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath }
          }
