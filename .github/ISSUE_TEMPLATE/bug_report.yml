name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill in as much detail as possible to help us reproduce and fix the issue.
        
        ---

  - type: dropdown
    id: bug_type
    attributes:
      label: Bug Type
      description: Which category best describes the issue?
      options:
        - Backup failed
        - Restore failed
        - Save path not detected correctly
        - Crash / Freeze
        - Other
    validations:
      required: true

  - type: input
    id: game_name
    attributes:
      label: Related Game (if applicable)
      description: If the issue is related to a specific game, please provide its name.
      placeholder: "e.g., Hollow Knight"

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g., After clicking 'Backup', the progress bar freezes at 100% and no backup file is created."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reliably reproduce the behavior.
      placeholder: |
        1. Open OGS and select game 'Hollow Knight'
        2. Click 'Backup Selected Games'
        3. Progress bar freezes, no response
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "A backup file should be created successfully and a completion message should appear."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any relevant error logs or drag-and-drop screenshots here.
      placeholder: "Paste logs or drag screenshots here..."
      render: text

  - type: input
    id: ogs_version
    attributes:
      label: OGS Version
      placeholder: "e.g., v0.7.1"
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: Operating System
      placeholder: "e.g., Windows 11 25H2"
    validations:
      required: true

  - type: checkboxes
    id: verification
    attributes:
      label: Submission Checklist
      options:
        - label: I have searched existing issues and confirmed this bug has not been reported before.
          required: true
